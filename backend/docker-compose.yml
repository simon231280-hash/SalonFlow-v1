version: "3.9"

services:

  db:
    image: postgres:17
    container_name: salonflow_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: salonflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build: .

    container_name: salonflow_api

    restart: unless-stopped

    depends_on:
      - db

    env_file:
      - .env.docker

    ports:
      - "8000:8000"


volumes:
  postgres_data:
